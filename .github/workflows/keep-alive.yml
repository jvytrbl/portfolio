name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. This pings the
# site's health endpoint (which runs `select 1`) twice a week.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables
# → add SITE_URL (e.g. https://your-domain.com).

on:
  schedule:
    - cron: "17 3 * * 1,4" # Mon & Thu 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL variable not set — skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 "$SITE_URL/api/health"
